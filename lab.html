<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>GENERIC — lab</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0b; color: #efeee7; font: 13px/1.4 'IBM Plex Mono', Consolas, monospace; overflow: hidden; }
      #lab { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
      #ui { position: fixed; top: 16px; left: 16px; width: 330px; max-height: calc(100% - 32px); overflow: auto; background: rgba(18,18,18,0.86); border: 1px solid #2a2a2a; padding: 14px 16px; box-sizing: border-box; }
      #ui[data-loading]::after { content: 'carregando…'; position: fixed; top: 20px; left: 370px; color: #ff9a4d; }
      h1 { font-size: 12px; font-weight: 500; letter-spacing: .12em; margin: 0 0 12px; color: #ff9a4d; }
      label { display: block; margin: 12px 0 6px; opacity: .6; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
      select, button { font: inherit; color: inherit; background: #1b1b1b; border: 1px solid #333; padding: 6px 8px; cursor: pointer; }
      select { width: 100%; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; }
      .row button.on { background: #efeee7; color: #111; border-color: #efeee7; }
      button:disabled { opacity: .3; cursor: default; }
      .stats { margin-top: 14px; border-top: 1px solid #2a2a2a; padding-top: 10px; }
      .stats div { display: flex; justify-content: space-between; gap: 10px; margin: 3px 0; }
      .stats span { opacity: .65; }
      .stats p { opacity: .5; font-size: 11px; margin: 8px 0 0; }
      b.ok { color: #7bd88f; } b.warn { color: #ffc861; } b.bad { color: #ff6b6b; }
      .use { width: 100%; margin-top: 14px; background: #ff9a4d; color: #111; border-color: #ff9a4d; font-weight: 500; }
      .link { display: block; margin-top: 10px; color: #efeee7; opacity: .7; }
    </style>
  </head>
  <body>
    <canvas id="lab"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/lab/main.ts"></script>
  </body>
</html>
